<g font-size="14">
<text x="40" y="624" font-weight="bold" font-size="16">Critérios adotados</text>
<text x="40" y="650">• Iluminação: 100 VA por cômodo (todos têm menos de 6 m² de ponto único; sala/copa/quarto adotados com 1 ponto de 100 VA, simplificado).</text>
<text x="40" y="672">• TUG: copa/cozinha 1 ponto a cada 3,5 m de perímetro, 600 VA nos 3 primeiros pontos; salas/quartos 1 a cada 5 m, 100 VA; banheiro 1 ponto de 600 VA junto à pia.</text>
<text x="40" y="694">• TUEs com circuito individual: geladeira, chuveiro e os dois condicionadores de ar (ar do quarto na parede da cabeceira) (potência de placa a confirmar).</text>
<text x="40" y="716">• Carga iluminação + TUG = 3,700 VA; TUE = 8,400 VA.</text>
<text x="40" y="738">• Demanda estimada ≈ 60% da carga instalada → ≈ 33 A em 220 V: sugere-se padrão bifásico com disjuntor geral 50 A (cabo 10 mm²) – validar com a concessionária.</text>
<text x="40" y="760">• Distribuição das fases F1/F2 equilibrada (127 V) – circuitos 220 V ocupam F1+F2.</text>
<text x="40" y="794" font-weight="bold" font-size="16">Quadro de distribuição – composição</text>
<text x="40" y="820">1 × disjuntor geral bipolar 50 A  •  1 × DPS classe II (20 kA) com disjuntor 25 A  •  DR 30 mA 2P 40 A para os circuitos 2 a 10 (ou DR por grupo: 127 V / 220 V)</text>
<text x="40" y="842">Disjuntores DIN: 4 × 10 A (C1, C6, C9, C10) • 4 × 16 A (C2, C3, C4, C5) • 1 × 32 A bipolar (C8) • 2 reservas  (QD embutido 18–24 módulos, h = 1,50 m)</text>
<text x="40" y="864">Aterramento: haste de aterramento + barramento PE e equipotencialização no QD; todos os circuitos com condutor de proteção (verde/amarelo).</text>
<text x="40" y="898" font-weight="bold" font-size="16">Cores dos condutores</text>
<text x="40" y="924">Fase: preto/vermelho • Neutro: azul-claro • Proteção (PE): verde ou verde/amarelo • Retorno: amarelo/branco</text>
</g></svg>